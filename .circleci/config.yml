  gate_nightly-v7_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Reverse index
          command: |
            mkdir -p /tmp/data
            { seq 1 200000 | tac | sha256sum ; } > /tmp/data/nightly-v7.log
            echo "data written to /tmp/data/nightly-v7.log, size=$(wc -c </tmp/data/nightly-v7.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - nightly-v7.log
  gate_CHECK_LAB_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Scan digits
          command: |
            mkdir -p /tmp/data
            { head -c 2000000 /dev/urandom | tr -dc 0-9 | wc -c ; } > /tmp/data/CHECK_LAB.log
            echo "data written to /tmp/data/CHECK_LAB.log, size=$(wc -c </tmp/data/CHECK_LAB.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - CHECK_LAB.log
  gate_ken-smoke_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Compress artifacts
          command: |
            mkdir -p /tmp/data
            { dd if=/dev/zero bs=1M count=600 2>/dev/null | gzip -9 | wc -c ; } > /tmp/data/ken-smoke.log
            echo "data written to /tmp/data/ken-smoke.log, size=$(wc -c </tmp/data/ken-smoke.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - ken-smoke.log
  gate_UAT_RUN_8_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Export manifest
          command: |
            mkdir -p /tmp/data
            { seq 1 300000 | sha256sum ; } > /tmp/data/UAT_RUN_8.log
            echo "data written to /tmp/data/UAT_RUN_8.log, size=$(wc -c </tmp/data/UAT_RUN_8.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - UAT_RUN_8.log
  gate_hu-run_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Factor batch
          command: |
            mkdir -p /tmp/data
            { seq 2 30000 | factor | wc -l ; } > /tmp/data/hu-run.log
            echo "data written to /tmp/data/hu-run.log, size=$(wc -c </tmp/data/hu-run.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - hu-run.log
  gate_sm-v2_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Square series
          command: |
            mkdir -p /tmp/data
            { seq 1 3000000 | awk '{print $1*$1}' | tail -1 ; } > /tmp/data/sm-v2.log
            echo "data written to /tmp/data/sm-v2.log, size=$(wc -c </tmp/data/sm-v2.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - sm-v2.log
