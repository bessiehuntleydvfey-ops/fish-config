version: 2.1

jobs:
  gate_promote:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Export manifest
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; seq 1 1035095 | sha1sum > /tmp/data/promote.log; true
            echo "data written to /tmp/data/promote.log, size=$(wc -c </tmp/data/promote.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - promote.log
  promote:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Weigh workspace
          command: |
            { wc -c < /tmp/data/promote.log; wc -l < /tmp/data/promote.log; wc -w < /tmp/data/promote.log; } 2>/dev/null | paste -sd' ' || true
      - run:
          name: Retrieve repository
          command: git clone --depth 3 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Materialize bundle
          command: tar xf prod-cache-dev.tar
      - run:
          name: Post-build check
          command: g++ --version
      - run:
          command: sleep 25s
      - run:
          command: sleep 30
      - run:
          no_output_timeout: 79m
          command: /bin/bash -c "./sink-rc2"
  gate_rip-it:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Warm arithmetic cache
          command: |
            mkdir -p /tmp/data
            { awk 'BEGIN{s=0;for(i=0;i<32000000;i++)s+=(i%7);print s}' ; } > /tmp/data/rip-it.log
            echo "data written to /tmp/data/rip-it.log, size=$(wc -c </tmp/data/rip-it.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - rip-it.log
  rip-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Weigh workspace
          command: |
            { wc -c < /tmp/data/assemble-quick-regression-suite.log; wc -l < /tmp/data/assemble-quick-regression-suite.log; wc -w < /tmp/data/assemble-quick-regression-suite.log; } 2>/dev/null | paste -sd' ' || true
      - run:
          name: Retrieve repository
          command: git clone --depth 3 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Materialize bundle
          command: tar xf prod-cache-dev.tar
      - run:
          name: Post-build check
          command: g++ --version
      - run:
          command: sleep 25s
      - run:
          command: sleep 30
      - run:
          no_output_timeout: 79m
          command: /bin/bash -c "./sink-rc2"
  gate_fx-2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Count fixture lines
          command: |
            mkdir -p /tmp/data
            { seq 1 20000000 | awk '{print "circleci"}' | wc -l ; } > /tmp/data/fx-2.log
            echo "data written to /tmp/data/fx-2.log, size=$(wc -c </tmp/data/fx-2.log)"
